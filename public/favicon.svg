<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background -->
  <rect width="200" height="200" rx="44" fill="#F3F0EE"/>

  <!-- Speedometer arc (scaled from 52x34 viewBox to fit ~120px wide, centered at 100,108) -->
  <!-- Outer ghost arc -->
  <path
    d="M 30 128 A 70 70 0 0 1 170 128"
    stroke="rgba(20,20,19,0.12)"
    stroke-width="10"
    stroke-linecap="round"
    fill="none"
  />
  <!-- Active arc (partial) -->
  <path
    d="M 30 128 A 70 70 0 0 1 136 62"
    stroke="#141413"
    stroke-width="10"
    stroke-linecap="round"
    fill="none"
  />
  <!-- Needle -->
  <line
    x1="100" y1="128"
    x2="128" y2="54"
    stroke="#141413"
    stroke-width="6"
    stroke-linecap="round"
  />
  <!-- Hub center outer -->
  <circle cx="100" cy="128" r="11" fill="#141413"/>
  <!-- Hub center inner -->
  <circle cx="100" cy="128" r="5" fill="#F3F0EE"/>

  <!-- Wordmark -->
  <text
    x="100"
    y="174"
    text-anchor="middle"
    font-family="'Sofia Sans', -apple-system, Arial, sans-serif"
    font-size="28"
    letter-spacing="-1"
    fill="#141413"
  ><tspan font-weight="900">Motor</tspan><tspan font-weight="300">Hub</tspan></text>
</svg>
